<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10141d">
    <title>DREAMEROL SYNC</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <main class="login-container">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">D</div>
            <h1>DREAMEROL SYNC</h1>
            <p>GitHub fork synchronization</p>
        </div>

        <section class="sync-panel" aria-labelledby="welcome-heading">
            <h2 id="welcome-heading">Welcome</h2>
            <p class="subtitle">Sign in with GitHub to preview and synchronize your forks securely.</p>

            <div class="auth-block">
                <button type="button" id="broker-login-button">Sign in with GitHub</button>
                <p id="auth-status" class="auth-status" role="status" aria-live="polite">Not signed in.</p>
                <a id="broker-link" class="auth-link" target="_blank" rel="noopener noreferrer" hidden>Open GitHub authorization</a>
            </div>
        </section>

        <footer>DREAMEROL SYNC</footer>
    </main>
</body>
</html>
